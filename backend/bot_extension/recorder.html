<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <title>SummaRise</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #09090b;
      color: #ffffff;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .recorder {
      width: 100%;
      padding: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;

      margin-bottom: 10px;

      font-size: 16px;
      font-weight: 600;
    }

    .dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #ef4444;

      box-shadow:
        0 0 10px rgba(239, 68, 68, 0.8);
    }

    #status {
      margin: 0;

      color: #a1a1aa;

      font-size: 13px;
      line-height: 1.4;
    }
  </style>
</head>

<body>

  <div class="recorder">

    <div class="brand">
      <span class="dot"></span>

      <span>SummaRise</span>
    </div>

    <p id="status">
      Preparing meeting recorder...
    </p>

  </div>

  <script src="recorder.js"></script>

</body>
</html>
